name: Validate catalog

on:
  push:
    branches:
      - main
      - firebase-catalog
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate catalog
        run: python scripts/validate_catalog.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
